<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy – Live AI Vision Form Coach</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- MediaPipe Pose CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        .vision-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            margin-top: 20px;
        }
        .canvas-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #output_canvas {
            width: 100%;
            height: auto;
            border-radius: 16px;
        }
        #input_video {
            display: none;
        }
        .telemetry-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid #00f0ff;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00f0ff;
        }
        .feedback-badge {
            background: rgba(57, 255, 20, 0.15);
            border: 1px solid #39ff14;
            color: #39ff14;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <h2> FitBuddy Live AI Vision Coach</h2>
            <a href="/" class="btn" style="padding: 8px 16px;">Back to Plans</a>
        </header>

        <div class="vision-container">
            <!-- Left: Video & Skeleton Canvas -->
            <div class="canvas-wrapper">
                <video id="input_video" playsinline></video>
                <canvas id="output_canvas" width="640" height="480"></canvas>
            </div>

            <!-- Right: Real-Time Telemetry & Form Guidance -->
            <div class="telemetry-panel">
                <h3>Live Telemetry</h3>
                
                <div class="stat-card">
                    <div style="font-size: 0.85rem; color: #94a3b8;">Rep Count</div>
                    <div class="stat-value" id="rep-counter">0</div>
                </div>

                <div class="stat-card" style="border-left-color: #f59e0b;">
                    <div style="font-size: 0.85rem; color: #94a3b8;">Joint Flexion Angle</div>
                    <div class="stat-value" id="angle-display" style="color: #f59e0b;">0°</div>
                </div>

                <div class="stat-card" style="border-left-color: #ec4899;">
                    <div style="font-size: 0.85rem; color: #94a3b8;">Movement Stage</div>
                    <div class="stat-value" id="stage-display" style="color: #ec4899; font-size: 1.4rem;">READY</div>
                </div>

                <div class="feedback-badge" id="coach-feedback">
                     Position your full body in frame to begin.
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/pose_tracker.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.getElementById('input_video');
            const canvasElement = document.getElementById('output_canvas');
            const repCounterEl = document.getElementById('rep-counter');
            const angleDisplayEl = document.getElementById('angle-display');
            const stageDisplayEl = document.getElementById('stage-display');
            const feedbackEl = document.getElementById('coach-feedback');

            if (!videoElement || !canvasElement) return;

            try {
                if (typeof FitBuddyPoseTracker !== 'undefined') {
                    const tracker = new FitBuddyPoseTracker(videoElement, canvasElement, (data) => {
                        if (repCounterEl) repCounterEl.innerText = data.reps;
                        if (angleDisplayEl) angleDisplayEl.innerText = `${data.angle}°`;
                        if (stageDisplayEl) stageDisplayEl.innerText = (data.stage || '').toUpperCase();
                        if (feedbackEl) feedbackEl.innerText = data.feedback;
                    });

                    if (typeof Pose !== 'undefined') {
                        const pose = new Pose({
                            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                        });

                        pose.setOptions({
                            modelComplexity: 1,
                            smoothLandmarks: true,
                            minDetectionConfidence: 0.5,
                            minTrackingConfidence: 0.5
                        });

                        pose.onResults((results) => {
                            tracker.processLandmarks(results.poseLandmarks);
                        });

                        if (typeof Camera !== 'undefined') {
                            const camera = new Camera(videoElement, {
                                onFrame: async () => {
                                    await pose.send({ image: videoElement });
                                },
                                width: 640,
                                height: 480
                            });
                            camera.start().catch((err) => {
                                if (feedbackEl) feedbackEl.innerText = "Camera permission denied or camera unavailable.";
                            });
                        }
                    }
                }
            } catch (err) {
                console.warn("Pose tracker initialization notice:", err);
            }
        });
    </script>
</body>
</html>
