services:
  - type: web
    name: fitbuddy-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GOOGLE_API_KEY
        sync: false
    disk:
      name: fitbuddy-db-data
      mountPath: /app/data
      sizeGB: 1
