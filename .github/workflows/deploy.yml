name: CI/CD Production Pre-Flight & Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Code Quality & Zero-Token Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt

      - name: Run Linter & Static Analysis (Ruff)
        run: |
          ruff check .

      - name: Execute Automated Test Suite (Zero Token Spend)
        env:
          GOOGLE_API_KEY: "mocked-test-key"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -v tests/test_fitbuddy.py

      - name: Verify Docker Container Build
        run: |
          docker build -t fitbuddy:latest .
