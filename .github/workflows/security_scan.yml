name: DevSecOps Security & Compliance Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1' # Weekly security audit every Monday at 04:00 UTC

jobs:
  security-scans:
    name: SAST, SCA, Secrets & Container CVE Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep pip-audit -r requirements.txt

      - name: Static Application Security Testing (Semgrep SAST)
        run: |
          semgrep scan --config auto --error --exclude tests/

      - name: Software Composition Analysis (pip-audit SCA)
        run: |
          pip-audit -r requirements.txt --strict

      - name: Build Container Image for CVE Scanning
        run: |
          docker build -t fitbuddy:scan-target .

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fitbuddy:scan-target'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
