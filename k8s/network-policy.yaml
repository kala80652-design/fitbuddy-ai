apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fitbuddy-network-policy
  namespace: fitbuddy
spec:
  podSelector:
    matchLabels:
      app: fitbuddy-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound only from ingress-controller or Nginx pods
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow egress to PostgreSQL database pods
    - to:
        - podSelector:
            matchLabels:
              app: fitbuddy-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Redis cluster/broker
    - to:
        - podSelector:
            matchLabels:
              app: fitbuddy-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution (CoreDNS)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound HTTPS for Google Gemini APIs (Port 443)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
