apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitbuddy-web
  namespace: fitbuddy
  labels:
    app: fitbuddy-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fitbuddy-web
  template:
    metadata:
      labels:
        app: fitbuddy-web
    spec:
      containers:
        - name: web
          image: fitbuddy:enterprise
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fitbuddy-config
            - secretRef:
                name: fitbuddy-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fitbuddy-web-hpa
  namespace: fitbuddy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fitbuddy-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: fitbuddy-service
  namespace: fitbuddy
spec:
  type: ClusterIP
  selector:
    app: fitbuddy-web
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitbuddy-ingress
  namespace: fitbuddy
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: fitbuddy.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fitbuddy-service
                port:
                  number: 80
